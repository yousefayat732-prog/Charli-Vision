name: Windows candidate build
on:
  workflow_dispatch:
  push:
    branches: [main, feature/vision-v10-v11, fix/v11-consistent-release-feed, fix/v11-no-api-limit]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore CharliVision.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build CharliVision.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained application
        shell: pwsh
        run: |
          dotnet publish CharliVision.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "${{ runner.temp }}/vision-publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create candidate installer
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$project = Get-Content CharliVision.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if (-not $version) { throw 'Missing project version' }
          vpk pack -u CharliVision.Desktop -v $version -p "${{ runner.temp }}/vision-publish" -e CharliVision.exe -o "${{ runner.temp }}/vision-packages" -c win -r win-x64 --packTitle "Charli Vision" --packAuthors "Charli Vision"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "${{ runner.temp }}/vision-packages"
          $feed = Get-Content "$root/releases.win.json" -Raw | ConvertFrom-Json
          foreach ($asset in $feed.Assets) {
            $path = Join-Path $root $asset.FileName
            if ((Get-FileHash $path).Hash -ne $asset.SHA256 -or (Get-Item $path).Length -ne $asset.Size) { throw 'Package verification failed' }
          }
      - name: Verify clean candidate installation and self-tests
        if: github.ref == 'refs/heads/fix/v11-no-api-limit'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ runner.temp }}/vision-packages"
          $setup = Join-Path $root 'CharliVision.Desktop-win-Setup.exe'
          $exe = Join-Path $env:LOCALAPPDATA 'CharliVision.Desktop/current/CharliVision.exe'
          if (Test-Path $exe) { throw 'Runner was not clean' }
          $process = Start-Process $setup -ArgumentList '--silent' -PassThru
          if (!$process.WaitForExit(120000) -or $process.ExitCode -ne 0) { throw 'Installer failed' }
          if (!(Test-Path $exe) -or (Get-Item $exe).VersionInfo.FileVersion -ne '1.7.4.0') { throw 'Wrong installed version' }
          $test = Start-Process $exe -ArgumentList '--self-test' -PassThru
          if (!$test.WaitForExit(90000) -or $test.ExitCode -ne 0) { throw 'Self-tests failed' }
          $rows = Get-Content "$env:APPDATA/CharliVision/self-test.txt"
          $pass = @($rows | Where-Object {$_ -like 'PASS:*'}).Count
          $fail = @($rows | Where-Object {$_ -like 'FAIL:*'}).Count
          if ($pass -lt 137 -or $fail -ne 0) { throw 'Self-test regression' }
          Write-Host "CLEAN_CANDIDATE_INSTALL=PASS; SELF_TESTS=$pass; FAIL=$fail"
      - uses: actions/upload-artifact@v4
        with:
          name: vision-unsigned-candidate
          path: ${{ runner.temp }}/vision-packages
          if-no-files-found: error
  stage-v174:
    needs: windows
    if: github.repository == 'yousefayat732-prog/Charli-Vision' && github.ref == 'refs/heads/fix/v11-no-api-limit'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vision-unsigned-candidate
          path: ${{ runner.temp }}/vision-tested
      - name: Verify reviewed build and prepare migration bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vision-tested'
          $stage = Join-Path $env:RUNNER_TEMP 'vision-release'
          New-Item $stage -ItemType Directory | Out-Null
          $index = Get-Content "$root/releases.win.json" -Raw | ConvertFrom-Json
          $full = @($index.Assets | Where-Object {$_.Type -eq 'Full' -and $_.Version -eq '1.7.4'})
          if ($full.Count -ne 1) { throw 'Missing full package' }
          foreach ($a in $index.Assets) {
            if ($a.PackageId -ne 'CharliVision.Desktop' -or $a.Version -ne '1.7.4' -or $a.FileName -ne (Split-Path $a.FileName -Leaf)) { throw 'Unexpected asset' }
            $package = Join-Path $root $a.FileName
            if ((Get-FileHash $package).Hash -ne $a.SHA256 -or (Get-Item $package).Length -ne $a.Size) { throw 'Invalid package' }
            Copy-Item $package $stage
          }
          $setup = [IO.Path]::GetFullPath("$root/CharliVision.Desktop-win-Setup.exe")
          Copy-Item $setup $stage
          Copy-Item "$root/releases.win.json" $stage
          $source = Join-Path $stage 'MigrationBridge.cs'
          $template = Get-Content installer/MigrationBridge.cs.txt -Raw
          [IO.File]::WriteAllText($source,$template.Replace('__VERSION__','1.7.4'),[Text.UTF8Encoding]::new($false))
          $bridge = Join-Path $stage 'CharliVision-1.7.4-Setup-x64.exe'
          $csc = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          $icon = [IO.Path]::GetFullPath((Join-Path $PWD.Path 'CharliVision.ico'))
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /reference:System.Windows.Forms.dll /reference:Microsoft.CSharp.dll "/win32icon:$icon" "/resource:$setup,VisionSetup" "/out:$bridge" $source
          if ($LASTEXITCODE -ne 0) { throw 'Bridge compilation failed' }
          $manifest = [ordered]@{Version='1.7.4';FileName=(Split-Path $bridge -Leaf);Sha256=(Get-FileHash $bridge).Hash;Size=(Get-Item $bridge).Length}
          [IO.File]::WriteAllText("$stage/CharliVision-update.json",($manifest|ConvertTo-Json -Compress),[Text.UTF8Encoding]::new($false))
          Remove-Item $source
      - name: Upload unpublished reviewed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.7.4'
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite' }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title "Charli Vision v1.7.4 - API-independent Updates" --notes "Reviewed candidate; RSA-PSS signatures must be verified before publication."
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/vision-release" -File | ForEach-Object FullName)
          gh release upload $tag --repo $env:GITHUB_REPOSITORY @files
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed' }
          Write-Host 'REVIEWED_DRAFT_STAGED=PASS'
